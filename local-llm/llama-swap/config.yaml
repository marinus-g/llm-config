# yaml-language-server: $schema=https://raw.githubusercontent.com/mostlygeek/llama-swap/refs/heads/main/config-schema.json
#
# llama-swap config — RTX 5090 (32 GB VRAM)
# Manages on-demand model loading so VRAM is shared across multiple models.
# opencode and any OpenAI-compatible client hit router port 5099; llama-swap backend listens on 5100.

healthCheckTimeout: 300
logLevel: info
logToStdout: both

# Global TTL: unload after 3 min idle (override per model).
# Short TTL keeps VRAM free for the compositor when inference is idle.
ttl: 180  # unload after 3 min idle (global default)

# LLAMA_API_KEY must be set in your shell env (or ~/.zprofile / ~/.profile).
# Must match opencode.json provider.llamaswap.options.apiKey ("llama-local").
# Example: export LLAMA_API_KEY=llama-local

macros:
  llama: ~/work/llm/llama.cpp/build/bin/llama-server
  models: ~/.lmstudio/models/lmstudio-community
  hf_cache: ~/.cache/huggingface/hub/

models:
  # ─────────────────────────────────────────────────────────────
  # Primary coder — Qwen3.6 27B Q4_K_M
  # Single 65536-token slot. This avoids llama.cpp splitting context across
  # parallel slots and gives opencode compaction/subagents a real 64k window.
  # Draft speculation is disabled: the older Qwen3 1.7B draft vocab is not
  # compatible with Qwen3.6 GGUF targets in llama.cpp.
  # ─────────────────────────────────────────────────────────────
  "qwen3-coder":
    name: "Qwen3.6 27B (coder)"
    description: "Main coding model — 65536 ctx, single slot, KV q8"
    ttl: 180  # unload after 3 min idle
    cmd: |
      ${llama}
      --port ${PORT}
      -m ${models}/Qwen3.6-27B-GGUF/Qwen3.6-27B-Q4_K_M.gguf
      -ngl 80
      -c 65536
      -np 1
      -n 8192
      -b 4096
      -ub 1024
      --cache-type-k q8_0
      --cache-type-v q8_0
      -fa auto
      --jinja
      --reasoning off
      --no-warmup
      --defrag-thold 0.1
      --temp 0.7
      --top-p 0.8
      --top-k 20
      --min-p 0
      --presence-penalty 1.0
      --api-key ${env.LLAMA_API_KEY}

  # ─────────────────────────────────────────────────────────────
  # Base Qwen3.6 27B Q5_K_M — reasoning enabled (thinking mode)
  # Uses --jinja for Qwen3.6 template. No --reasoning off → thinking is on.
  # Coding sampling: temp 0.6, top-k 20, top-p 0.95, min-p 0.
  # ─────────────────────────────────────────────────────────────
  "qwen3-base":
    name: "Qwen3.6 27B Q5 (base, reasoning)"
    description: "Q5_K_M — reasoning enabled, 196608 ctx, single slot, KV q8"
    ttl: 180  # unload after 3 min idle
    cmd: |
      ${llama}
      --port ${PORT}
      -m ${models}/Qwen3.6-27B-GGUF/Qwen3.6-27B-Q5_K_M.gguf
      -ngl auto
      --fit-target 3072
      -c 196608
      -np 1
      -n 8192
      -b 4096
      -ub 1024
      --cache-type-k q8_0
      --cache-type-v q8_0
      -fa auto
      --jinja
      --no-warmup
      --defrag-thold 0.1
      --temp 0.6
      --top-k 20
      --top-p 0.95
      --min-p 0
      --presence-penalty 0.0
      --api-key ${env.LLAMA_API_KEY}

  # ─────────────────────────────────────────────────────────────
  # Primary coder quality test — Qwen3.6 27B Q6_K
  # Higher-quality quant than Q4_K_M. Fits should be checked on the 5090 with
  # the same 65536-token slot before promoting it.
  # ─────────────────────────────────────────────────────────────
  "qwen3-coder-q6":
    name: "Qwen3.6 27B Q6 (coder)"
    description: "Q6_K quality test — 65536 ctx, single slot, KV q8"
    ttl: 180  # unload after 3 min idle
    cmd: |
      ${llama}
      --port ${PORT}
      -m ${models}/Qwen3.6-27B-GGUF/Qwen3.6-27B-Q6_K.gguf
      -ngl 80
      -c 65536
      -np 1
      -n 8192
      -b 4096
      -ub 1024
      --cache-type-k q8_0
      --cache-type-v q8_0
      -fa auto
      --jinja
      --reasoning off
      --no-warmup
      --defrag-thold 0.1
      --temp 0.7
      --top-p 0.8
      --top-k 20
      --min-p 0
      --presence-penalty 1.0
      --api-key ${env.LLAMA_API_KEY}

  # ─────────────────────────────────────────────────────────────
  # Middle-context coder — same 27B, one 98304-token slot.
  # Use when a delegated opencode agent needs more room than the default
  # coder profile but the full large-context profile is overkill.
  # ─────────────────────────────────────────────────────────────
  "qwen3-coder-mid":
    name: "Qwen3.6 27B (mid context)"
    description: "98304 ctx, single slot — larger delegated coder"
    ttl: 180  # unload after 3 min idle
    cmd: |
      ${llama}
      --port ${PORT}
      -m ${models}/Qwen3.6-27B-GGUF/Qwen3.6-27B-Q4_K_M.gguf
      -ngl 80
      -c 98304
      -np 1
      -n 8192
      -b 4096
      -ub 1024
      --cache-type-k q8_0
      --cache-type-v q8_0
      -fa auto
      --jinja
      --reasoning off
      --no-warmup
      --defrag-thold 0.1
      --temp 0.7
      --top-p 0.8
      --top-k 20
      --min-p 0
      --presence-penalty 1.0
      --api-key ${env.LLAMA_API_KEY}

  # ─────────────────────────────────────────────────────────────
  # Middle-context coder quality test — Qwen3.6 27B Q6_K
  # This is the profile to try for OpenCode subagents before changing
  # small_model or agent defaults.
  # ─────────────────────────────────────────────────────────────
  "qwen3-coder-mid-q6":
    name: "Qwen3.6 27B Q6 (mid context)"
    description: "Q6_K quality test — 98304 ctx, single slot, KV q8"
    ttl: 180  # unload after 3 min idle
    cmd: |
      ${llama}
      --port ${PORT}
      -m ${models}/Qwen3.6-27B-GGUF/Qwen3.6-27B-Q6_K.gguf
      -ngl auto
      --fit-target 3072
      -c 98304
      -np 1
      -n 8192
      -b 4096
      -ub 1024
      --cache-type-k q8_0
      --cache-type-v q8_0
      -fa auto
      --jinja
      --reasoning off
      --no-warmup
      --defrag-thold 0.1
      --temp 0.7
      --top-p 0.8
      --top-k 20
      --min-p 0
      --presence-penalty 1.0
      --api-key ${env.LLAMA_API_KEY}

  # ─────────────────────────────────────────────────────────────
  # Large-context coder — same 27B, 196608 ctx, NO speculative decoding.
  # Use for long review sessions or large codebase analysis where
  # compaction is worse than slightly slower tokens/sec.
  # ─────────────────────────────────────────────────────────────
  "qwen3-coder-large":
    name: "Qwen3.6 27B (large context)"
    description: "196608 ctx, single slot, no speculative decoding — less compaction for long sessions"
    ttl: 180  # unload after 3 min idle
    cmd: |
      ${llama}
      --port ${PORT}
      -m ${models}/Qwen3.6-27B-GGUF/Qwen3.6-27B-Q4_K_M.gguf
      -ngl auto
      --fit-target 3072
      -c 196608
      -np 1
      -n 8192
      -b 4096
      -ub 1024
      --cache-type-k q8_0
      --cache-type-v q8_0
      -fa auto
      --jinja
      --reasoning off
      --no-warmup
      --defrag-thold 0.1
      --temp 0.7
      --top-p 0.8
      --top-k 20
      --min-p 0
      --presence-penalty 1.0
      --api-key ${env.LLAMA_API_KEY}

  # ─────────────────────────────────────────────────────────────
  # Vision model — same 27B weights + multimodal projector
  # Enables image understanding (screenshots, diagrams, photos).
  # Shares weights file with qwen3-coder; llama-swap unloads coder
  # first since both need ~17-18 GB.
  # Context trimmed to 49152 to leave room for mmproj overhead.
  # ─────────────────────────────────────────────────────────────
  "qwen3-vl":
    name: "Qwen3.6 27B VL (vision)"
    description: "27B with multimodal projector — images + text"
    ttl: 300  # unload after 5 min idle (less frequently used)
    cmd: |
      ${llama}
      --port ${PORT}
      -m ${models}/Qwen3.6-27B-GGUF/Qwen3.6-27B-Q4_K_M.gguf
      --mmproj ${models}/Qwen3.6-27B-GGUF/mmproj-Qwen3.6-27B-BF16.gguf
      -ngl 80
      -c 49152
      -n 8192
      -b 512
      -ub 512
      --cache-type-k q8_0
      --cache-type-v q8_0
      -fa auto
      --jinja
      --no-warmup
      --defrag-thold 0.1
      --temp 0.7
      --top-p 0.8
      --top-k 20
      --min-p 0
      --presence-penalty 1.0
      --api-key ${env.LLAMA_API_KEY}

  # ─────────────────────────────────────────────────────────────
  # MoE reasoning model — Qwen3.6 35B-A3B (Mixture of Experts)
  # 35B total params, only ~3B active per token → fast inference,
  # large capacity. Good for hard reasoning, long refactors.
  # 20 GB model — loads alone, unloads coder. On-demand only.
  # ─────────────────────────────────────────────────────────────
  "qwen3-moe":
    name: "Qwen3.6 35B MoE (reasoning)"
    description: "35B MoE, 3B active — fast + strong reasoning"
    ttl: 300  # unload after 5 min idle
    cmd: |
      ${llama}
      --port ${PORT}
      -m ${models}/Qwen3.6-35B-A3B-GGUF/Qwen3.6-35B-A3B-Q4_K_M.gguf
      -ngl 80
      -c 65536
      -n 8192
      -b 4096
      -ub 1024
      --cache-type-k q8_0
      --cache-type-v q8_0
      -fa auto
      --jinja
      --reasoning off
      --no-warmup
      --defrag-thold 0.1
      --temp 0.7
      --top-p 0.8
      --top-k 20
      --min-p 0
      --presence-penalty 1.0
      --api-key ${env.LLAMA_API_KEY}

  # ─────────────────────────────────────────────────────────────
  # MoE large-context — same 35B MoE weights, 131072 ctx.
  # Use for long orchestrator sessions to avoid compaction loops.
  # No draft model here: the 131072 ctx KV cache plus draft KV cache OOMs.
  # ─────────────────────────────────────────────────────────────
  "qwen3-moe-large":
    name: "Qwen3.6 35B MoE (large context)"
    description: "131072 ctx — for long orchestrator sessions, no speculative decoding"
    ttl: 300  # unload after 5 min idle
    cmd: |
      ${llama}
      --port ${PORT}
      -m ${models}/Qwen3.6-35B-A3B-GGUF/Qwen3.6-35B-A3B-Q4_K_M.gguf
      -ngl 80
      -c 131072
      -np 1
      -n 8192
      -b 4096
      -ub 1024
      --cache-type-k q8_0
      --cache-type-v q8_0
      -fa auto
      --jinja
      --reasoning off
      --no-warmup
      --defrag-thold 0.1
      --temp 0.7
      --top-p 0.8
      --top-k 20
      --min-p 0
      --presence-penalty 1.0
      --api-key ${env.LLAMA_API_KEY}

  # ─────────────────────────────────────────────────────────────
  # MoE vision — 35B MoE with mmproj (strongest vision option)
  # ─────────────────────────────────────────────────────────────
  "qwen3-moe-vl":
    name: "Qwen3.6 35B MoE VL (vision, strong)"
    description: "35B MoE + multimodal projector — best vision quality"
    ttl: 180  # unload after 3 min idle
    cmd: |
      ${llama}
      --port ${PORT}
      -m ${models}/Qwen3.6-35B-A3B-GGUF/Qwen3.6-35B-A3B-Q4_K_M.gguf
      --mmproj ${models}/Qwen3.6-35B-A3B-GGUF/mmproj-Qwen3.6-35B-A3B-BF16.gguf
      -ngl 80
      -c 32768
      -n 8192
      -b 512
      -ub 512
      --cache-type-k q8_0
      --cache-type-v q8_0
      -fa auto
      --jinja
      --no-warmup
      --defrag-thold 0.1
      --temp 0.7
      --top-p 0.8
      --top-k 20
      --min-p 0
      --presence-penalty 1.0
      --api-key ${env.LLAMA_API_KEY}

  # ─────────────────────────────────────────────────────────────
  # Qwopus3.6 27B Coder MTP Q6_K — focused profile.
  # The model was trained through 32768 tokens; YaRN expands it to 65536.
  # Embedded MTP uses the model's two auxiliary prediction heads.
  # ─────────────────────────────────────────────────────────────
  "qwopus-coder-q6":
    name: "Qwopus3.6 27B Coder MTP Q6 (focused)"
    description: "Qwopus Q6_K — 65536 ctx, YaRN 2x, embedded MTP"
    ttl: 300  # unload after 5 min idle
    cmd: |
      ${llama}
      --port ${PORT}
      -m ~/.lmstudio/models/Jackrong/Qwopus3.6-27B-Coder-MTP-GGUF/Qwopus3.6-27B-Coder-MTP-Q6_K.gguf
      -ngl 80
      -c 65536
      -np 1
      -n 8192
      -b 2048
      -ub 512
      --cache-type-k q8_0
      --cache-type-v q8_0
      -fa auto
      --spec-type draft-mtp
      --spec-draft-n-max 2
      --rope-scaling yarn
      --rope-scale 2
      --yarn-orig-ctx 32768
      --jinja
      --reasoning off
      --no-warmup
      --temp 0.7
      --top-p 0.8
      --top-k 20
      --min-p 0
      --presence-penalty 1.0
      --api-key ${env.LLAMA_API_KEY}

  # ─────────────────────────────────────────────────────────────
  # Qwopus3.6 27B Coder MTP Q6_K — middle-context profile.
  # YaRN expands the 32768-token training context to 98304 tokens.
  # ─────────────────────────────────────────────────────────────
  "qwopus-coder-mid-q6":
    name: "Qwopus3.6 27B Coder MTP Q6 (mid context)"
    description: "Qwopus Q6_K — 98304 ctx, YaRN 3x, embedded MTP"
    ttl: 300  # unload after 5 min idle
    cmd: |
      ${llama}
      --port ${PORT}
      -m ~/.lmstudio/models/Jackrong/Qwopus3.6-27B-Coder-MTP-GGUF/Qwopus3.6-27B-Coder-MTP-Q6_K.gguf
      -ngl auto
      --fit-target 3072
      -c 98304
      -np 1
      -n 8192
      -b 2048
      -ub 512
      --cache-type-k q8_0
      --cache-type-v q8_0
      -fa auto
      --spec-type draft-mtp
      --spec-draft-n-max 2
      --rope-scaling yarn
      --rope-scale 3
      --yarn-orig-ctx 32768
      --jinja
      --reasoning off
      --no-warmup
      --temp 0.7
      --top-p 0.8
      --top-k 20
      --min-p 0
      --presence-penalty 1.0
      --api-key ${env.LLAMA_API_KEY}

  # ─────────────────────────────────────────────────────────────
  # Qwopus3.6 27B Coder MTP Q6_K — large-context profile.
  # YaRN expands the 32768-token training context to 196608 tokens. Embedded
  # A 3 GiB fit target leaves about 2 GiB after the extra MTP context is built.
  # ─────────────────────────────────────────────────────────────
  "qwopus-coder-large-q6":
    name: "Qwopus3.6 27B Coder MTP Q6 (large context)"
    description: "Qwopus Q6_K — 196608 ctx, YaRN 6x, embedded MTP, 2 GiB VRAM reserve"
    ttl: 300  # unload after 5 min idle
    cmd: |
      ${llama}
      --port ${PORT}
      -m ~/.lmstudio/models/Jackrong/Qwopus3.6-27B-Coder-MTP-GGUF/Qwopus3.6-27B-Coder-MTP-Q6_K.gguf
      -ngl auto
      --fit-target 3072
      -c 196608
      -np 1
      -n 8192
      -b 2048
      -ub 512
      --cache-type-k q8_0
      --cache-type-v q8_0
      -fa auto
      --spec-type draft-mtp
      --spec-draft-n-max 2
      --rope-scaling yarn
      --rope-scale 6
      --yarn-orig-ctx 32768
      --jinja
      --reasoning off
      --no-warmup
      --temp 0.7
      --top-p 0.8
      --top-k 20
      --min-p 0
      --presence-penalty 1.0
      --api-key ${env.LLAMA_API_KEY}

  # ─────────────────────────────────────────────────────────────
  # FastContext 4B RL — repo-exploration subagent
  # Microsoft FastContext-1.0-4B-RL: purpose-built for codebase exploration.
  # READ/GLOB/GREP only; returns compact path:line evidence. 4B params so it
  # loads/unloads fast alongside the main coder.
  # 2 parallel slots × 256K ctx/slot = 524288 total KV tokens.
  # VRAM breakdown: ~2.4 GB weights + ~18 GB KV cache (Q4_0) ≈ 20 GB — fits the 5090.
  # ─────────────────────────────────────────────────────────────
  "fastcontext-4b":
    name: "FastContext 4B RL (repo explorer)"
    description: "Microsoft FastContext-1.0-4B-RL — 2 parallel slots, 256K ctx/slot, evicts primary GPU model"
    ttl: 300  # unload after 5 min idle
    cmd: |
      ${llama}
      --port ${PORT}
      -m ~/.lmstudio/models/microsoft/FastContext-1.0-4B-RL-GGUF/FastContext-1.0-4B-RL-Q4_K_M.gguf
      -ngl 99
      -c 524288
      -np 2
      -n 4096
      -b 2048
      -ub 512
      --cache-type-k q4_0
      --cache-type-v q4_0
      -fa auto
      --jinja
      --no-warmup
      --defrag-thold 0.1
      --temp 0.7
      --top-p 0.8
      --top-k 20
      --min-p 0
      --presence-penalty 1.0
      --repeat-penalty 1.1
      --repeat-last-n 256
      --api-key ${env.LLAMA_API_KEY}

  # =============================================================================
  # CPU shadow variants — same weights, -ngl 0 (all layers on CPU/RAM).
  # Used as secondary models when a GPU model is already loaded.
  # Short TTL (120 s): once the router promotes back to GPU, these unload quickly.
  # =============================================================================

  "fastcontext-4b-cpu":
    name: "FastContext 4B RL (CPU fallback)"
    description: "CPU fallback for explore agent — 4 parallel slots, 96K ctx/slot, all layers on CPU"
    ttl: 120  # unload after 2 min idle (CPU shadow)
    cmd: |
      ${llama}
      --port ${PORT}
      -m ~/.lmstudio/models/microsoft/FastContext-1.0-4B-RL-GGUF/FastContext-1.0-4B-RL-Q4_K_M.gguf
      -ngl 0
      -c 393216
      -np 4
      -n 4096
      -b 512
      -ub 256
      --cache-type-k q4_0
      --cache-type-v q4_0
      --jinja
      --no-warmup
      --temp 0.7
      --top-p 0.8
      --top-k 20
      --min-p 0
      --presence-penalty 1.0
      --repeat-penalty 1.1
      --repeat-last-n 256
      --api-key ${env.LLAMA_API_KEY}

  "qwen3-coder-cpu":
    name: "Qwen3 1.7B (coder CPU fallback)"
    description: "Fast CPU shadow — small text fallback while GPU is occupied"
    ttl: 120  # unload after 2 min idle (CPU shadow)
    cmd: |
      ${llama}
      --port ${PORT}
      -m ${models}/qwen3-draft/Qwen3-1.7B-Q8_0.gguf
      -ngl 0
      -c 32768
      -np 1
      -n 8192
      -b 512
      -ub 256
      --cache-type-k q8_0
      --cache-type-v q8_0
      --jinja
      --no-warmup
      --temp 0.7
      --top-p 0.8
      --top-k 20
      --min-p 0
      --presence-penalty 1.0
      --api-key ${env.LLAMA_API_KEY}

  "qwen3-coder-mid-cpu":
    name: "Qwen3 1.7B mid ctx (CPU fallback)"
    description: "Fast CPU shadow — mid-context text fallback while GPU is occupied"
    ttl: 120  # unload after 2 min idle (CPU shadow)
    cmd: |
      ${llama}
      --port ${PORT}
      -m ${models}/qwen3-draft/Qwen3-1.7B-Q8_0.gguf
      -ngl 0
      -c 65536
      -np 1
      -n 8192
      -b 512
      -ub 256
      --cache-type-k q8_0
      --cache-type-v q8_0
      --jinja
      --no-warmup
      --temp 0.7
      --top-p 0.8
      --top-k 20
      --min-p 0
      --presence-penalty 1.0
      --api-key ${env.LLAMA_API_KEY}

  "qwen3-coder-large-cpu":
    name: "Qwen3 1.7B large ctx (CPU fallback)"
    description: "Fast CPU shadow — large-context text fallback while GPU is occupied"
    ttl: 120  # unload after 2 min idle (CPU shadow)
    cmd: |
      ${llama}
      --port ${PORT}
      -m ${models}/qwen3-draft/Qwen3-1.7B-Q8_0.gguf
      -ngl 0
      -c 145408
      -np 1
      -n 8192
      -b 512
      -ub 256
      --cache-type-k q8_0
      --cache-type-v q8_0
      --jinja
      --no-warmup
      --temp 0.7
      --top-p 0.8
      --top-k 20
      --min-p 0
      --presence-penalty 1.0
      --api-key ${env.LLAMA_API_KEY}

  "qwen3-vl-cpu":
    name: "Qwen3.6 27B VL (CPU)"
    description: "CPU shadow — vision model while GPU is occupied"
    ttl: 120  # unload after 2 min idle (CPU shadow)
    cmd: |
      ${llama}
      --port ${PORT}
      -m ${models}/Qwen3.6-27B-GGUF/Qwen3.6-27B-Q4_K_M.gguf
      --mmproj ${models}/Qwen3.6-27B-GGUF/mmproj-Qwen3.6-27B-BF16.gguf
      -ngl 0
      -c 49152
      -np 1
      -n 8192
      -b 512
      -ub 256
      --cache-type-k q8_0
      --cache-type-v q8_0
      --jinja
      --no-warmup
      --temp 0.7
      --top-p 0.8
      --top-k 20
      --min-p 0
      --presence-penalty 1.0
      --api-key ${env.LLAMA_API_KEY}

  "qwen3-moe-cpu":
    name: "Qwen3 1.7B (MoE CPU fallback)"
    description: "Fast CPU shadow — text fallback while GPU is occupied"
    ttl: 120  # unload after 2 min idle (CPU shadow)
    cmd: |
      ${llama}
      --port ${PORT}
      -m ${models}/qwen3-draft/Qwen3-1.7B-Q8_0.gguf
      -ngl 0
      -c 65536
      -np 1
      -n 8192
      -b 512
      -ub 256
      --cache-type-k q8_0
      --cache-type-v q8_0
      --jinja
      --no-warmup
      --temp 0.7
      --top-p 0.8
      --top-k 20
      --min-p 0
      --presence-penalty 1.0
      --api-key ${env.LLAMA_API_KEY}

  "qwen3-moe-large-cpu":
    name: "Qwen3 1.7B large ctx (MoE CPU fallback)"
    description: "Fast CPU shadow — large-context text fallback while GPU is occupied"
    ttl: 120  # unload after 2 min idle (CPU shadow)
    cmd: |
      ${llama}
      --port ${PORT}
      -m ${models}/qwen3-draft/Qwen3-1.7B-Q8_0.gguf
      -ngl 0
      -c 131072
      -np 1
      -n 8192
      -b 512
      -ub 256
      --cache-type-k q8_0
      --cache-type-v q8_0
      --jinja

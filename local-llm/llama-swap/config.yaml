# =============================================================================
# matrix: concurrent model combinations
# GPU models can coexist with CPU shadow models (one of each at a time).
# Two GPU models or two CPU models cannot coexist.
# Subset semantics: each pair is a valid set, so single models also run alone.
# =============================================================================
matrix:
  prioritize_requested: true
  vars:
    # GPU models
    c:   qwen3-coder
    cm:  qwen3-coder-mid
    cl:  qwen3-coder-large
    v:   qwen3-vl
    m:   qwen3-moe
    ml:  qwen3-moe-large
    mv:  qwen3-moe-vl
    q:   qwopus-coder-q6
    qm:  qwopus-coder-mid-q6
    ql:  qwopus-coder-large-q6
    g31: gemma4-31b
    kv:  keye-vl
    g12: gemma4-12b-coder
    wq:  qwable-q6
    wqm: qwable-mid-q6
    wl:  qwable-large
    wmt: qwable-mtp
    wmtm: qwable-mtp-mid
    orn:  ornith-35b
    ornm: ornith-35b-max
    tc:   thinkingcap
    tcl:  thinkingcap-large
    wmp:  qwen3-mtp
    wmpm: qwen3-mtp-mid
    # FastContext exploration model (4B — evicts main GPU model when requested;
    # no coexistence set, so loading it unloads whatever is resident)
    fc:  fastcontext-4b
    fcc: fastcontext-4b-cpu
    # CPU shadow models
    cc:  qwen3-coder-cpu
    cmc: qwen3-coder-mid-cpu
    clc: qwen3-coder-large-cpu
    vc:  qwen3-vl-cpu
    mc:  qwen3-moe-cpu
    mlc: qwen3-moe-large-cpu
    mvc: qwen3-moe-vl-cpu
    gvc: gemma3-vl-cpu
  sets:
    # Any single Qwen GPU model may run alongside any single CPU shadow model.
    # Qwopus profiles intentionally run alone so stale CPU shadows do not stay
    # loaded while opencode swaps between Qwopus context sizes.
    gpu_cpu: "(c | cm | cl | v | m | ml | mv | g31 | kv | g12 | wq | wqm | wl | wmt | wmtm | orn | ornm | tc | tcl | wmp | wmpm) & (cc | cmc | clc | vc | mc | mlc | mvc | gvc | fcc)"
    # fcc (fastcontext-4b-cpu) is in gpu_cpu above so it can coexist with a GPU primary as
    # a manual shadow, but fastcontext-4b (GPU) is intentionally in NO coexistence set:
    # loading it evicts whatever GPU model is resident, giving FastContext the full card
    # (~30 GB free after eviction) for 4 slots × 96K ctx (q4_0 KV ≈ 14 GB + 2.5 GB weights).
    # The router retries on fastcontext-4b-cpu if the GPU load fails (safety net only).
